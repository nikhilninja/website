server {
    listen 80;
    server_name _;

    # Disable absolute redirects so Nginx generates relative Location headers
    # This preserves https:// through Cloudflare and reverse proxies without Mixed Content errors
    absolute_redirect off;

    # Root directory of static built files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml;

    # Client body size for CMS media uploads
    client_max_body_size 50M;

    # ── 1. Direct Camera Path Proxy (Fallback for WHEP reader.js requests) ──
    location ~* ^/(camera_[0-9a-zA-Z_-]+)(/.*)?$ {
        proxy_pass http://mediamtx:8889/$1$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ── 2. MediaMTX WebRTC Stream / WHEP Reverse Proxy ──
    location /mediamtx-webrtc/ {
        proxy_pass http://mediamtx:8889/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect ~^/(.*) /mediamtx-webrtc/$1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ── 3. MediaMTX HLS Stream Reverse Proxy ──
    location /mediamtx-hls/ {
        proxy_pass http://mediamtx:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect ~^/(.*) /mediamtx-hls/$1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ── 4. CMS Content API ──
    location /api/ {
        proxy_pass http://content-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── 5. CMS Uploaded Files ──
    location /uploads/ {
        proxy_pass http://content-api:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── 6. React Single Page App (SPA) Routing fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}

