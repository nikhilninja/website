# MediaMTX Configuration for Sarani Rehab CCTV Streaming
# Universal H.264 WebRTC compatibility with LAN ICE candidate routing

logLevel: info
logDestinations: [stdout]

# RTSP Server Settings
rtsp: yes
rtspAddress: :8554

# WebRTC / WHEP Server Settings
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcAdditionalHosts: ["192.168.31.184", "192.168.31.211"]
webrtcLocalUDPAddress: :8189

# HLS Server Settings
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]

# Path Configurations for CCTV Cameras (On-Demand Bandwidth Saving)
paths:
  ~^(camera_01|camera_1)$:
    source: "rtsp://admin:L24AD39B@192.168.31.32:554/cam/realmonitor?channel=1&subtype=1"
    rtspTransport: tcp
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 25s
    sourceOnDemandCloseAfter: 60s
    record: no

