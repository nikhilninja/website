# MediaMTX Configuration for Sarani Rehab CCTV Streaming
# Universal H.264 WebRTC compatibility with LAN ICE candidate routing

logLevel: info
logDestinations: [stdout]

# RTSP Server Settings
rtsp: yes
rtspAddress: :8554

# WebRTC / WHEP Server Settings
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcAdditionalHosts: ["192.168.31.184"]
webrtcLocalUDPAddress: :8189

# HLS Server Settings
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]

# Path Configurations for 7 CCTV Cameras
paths:
