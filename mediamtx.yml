# MediaMTX Configuration for Sarani Rehab CCTV Streaming
# Place this file in your MediaMTX directory and run mediamtx.exe

logLevel: info
logDestinations: [stdout]

# RTSP Server Settings (CCTV camera RTSP pull/push)
rtsp: yes
rtspAddress: :8554

# WebRTC / WHEP Server Settings (Used by React Frontend iframe / player)
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]

# HLS Server Settings (Fallback streaming)
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]

# Path Configurations for 5 CCTV Cameras
paths:
  camera_01:
    source: "rtsp://admin:L24AD39B@192.168.31.32:554/cam/realmonitor?channel=1&subtype=0&unicast=true&proto=Onvif"
    rtspTransport: automatic
    sourceOnDemand: no
    record: no

  camera_2:
    source: "rtsp://admin:L2D529C5@192.168.31.210:554/cam/realmonitor?channel=1&subtype=0&unicast=true&proto=Onvif"
    rtspTransport: automatic
    sourceOnDemand: no
    record: no

  camera_3:
